name: Robot Framework Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código do repositório
      - name: Checkout Code
        uses: actions/checkout@v3

      # Configuração do Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Instalação das dependências
      - name: Install Dependencies
        run: |
          pip install robotframework robotframework-requests robotframework-reporter

      # Execução dos testes com relatório no console
      - name: Run Robot Framework Tests
        run: |
          robot --loglevel DEBUG ./Test/API_Serverest.robot

      # Debugging step to verify test reports
      - name: Debug Test Reports
        run: ls -al ./Test

      # Upload dos relatórios gerados
      - name: Upload Robot Framework Reports
        uses: actions/upload-artifact@v2
        with:
          name: robot-reports
          path: |
            report.html
            log.html